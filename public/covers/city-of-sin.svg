<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsl(203, 76%, 27%);stop-opacity:1" />
      <stop offset="100%" style="stop-color:hsl(23, 76%, 42%);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <!-- Decorative top band -->
  <rect x="0" y="0" width="400" height="6" fill="hsl(243, 76%, 52%)" opacity="0.8"/>
  <!-- Decorative bottom band -->
  <rect x="0" y="554" width="400" height="6" fill="hsl(243, 76%, 52%)" opacity="0.8"/>
  <!-- Title -->
  <text x="200" y="220" text-anchor="middle" fill="white" 
        font-family="Georgia,serif" font-size="26" font-weight="bold"
        filter="url(#glow)">City of Sin</text>
  <!-- Divider -->
  <line x1="80" y1="260" x2="320" y2="260" stroke="hsl(243, 76%, 52%)" stroke-width="1" opacity="0.6"/>
  <circle cx="200" cy="260" r="4" fill="hsl(243, 76%, 52%)"/>
  <!-- Author -->
  <text x="200" y="320" text-anchor="middle" fill="hsl(243, 76%, 52%)" 
        font-family="Georgia,serif" font-size="16" opacity="0.85">Misty Rain of Jiangnan</text>
  <!-- Decorative circle -->
  <circle cx="200" cy="420" r="50" fill="none" stroke="hsl(243, 76%, 52%)" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="420" r="35" fill="none" stroke="hsl(23, 76%, 42%)" stroke-width="1" opacity="0.3"/>
  <!-- Genre hint at bottom -->
  <text x="200" y="510" text-anchor="middle" fill="white" opacity="0.4"
        font-family="Helvetica,sans-serif" font-size="11" letter-spacing="3">NEXUS TALES</text>
</svg>
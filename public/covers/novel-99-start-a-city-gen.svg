<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="450" fill="url(#bg)" rx="8"/>
  <rect x="8" y="8" width="284" height="434" fill="none" stroke="#e94560" stroke-width="1" rx="4" opacity="0.5"/>
  <rect x="16" y="16" width="268" height="418" fill="none" stroke="#e94560" stroke-width="0.5" rx="2" opacity="0.3"/>
  <text x="150" y="200" text-anchor="middle" fill="#e94560" font-size="28" font-family="serif" filter="url(#glow)" opacity="0.95">
    开局一座城
  </text>
  <text x="150" y="380" text-anchor="middle" fill="#e94560" font-size="11" font-family="sans-serif" opacity="0.5">
    XIANXIA · NOVEL
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#41295a"/>
      <stop offset="55%" style="stop-color:#2f0743"/>
      <stop offset="100%" style="stop-color:#d7a9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect width="400" height="560" fill="url(#glow)"/>
  <!-- Decorative top border -->
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <rect x="26" y="26" width="348" height="508" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
  <!-- Motif -->
  <text x="200" y="90" text-anchor="middle" font-size="40" fill="rgba(255,255,255,0.18)">✦</text>
  <!-- Title -->
    <text x="200" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-weight="bold" letter-spacing="0.5">Douluo Dalu</text>
  <!-- Separator -->
  <line x1="120" y1="400" x2="280" y2="400" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Author -->
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="rgba(255,255,255,0.7)" font-style="italic">Unknown</text>
  <!-- Footer -->
  <text x="200" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.45)" letter-spacing="2">NEXUS TALES</text>
</svg>